<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        :root{--bg-color:#23272a;--card-bg:#2c2f33;--primary:#5865F2;--primary-hover:#4752C4;--success:#3ba55d;--danger:#ed4245;--text-main:#ffffff;--text-muted:#b9bbbe;--input-bg:#202225;}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
        body{background-color:var(--bg-color);color:var(--text-main);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;}
        .container{width:100%;max-width:450px;padding:20px;}
        .card{background-color:var(--card-bg);border-radius:12px;padding:30px;box-shadow:0 8px 24px rgba(0,0,0,0.2);}
        h2{text-align:center;margin-bottom:20px;color:var(--text-main);}
        .form-group{margin-bottom:15px;}
        label{display:block;margin-bottom:8px;color:var(--text-muted);font-size:14px;font-weight:600;}
        input[type="password"],input[type="text"],select{width:100%;padding:12px;background-color:var(--input-bg);border:1px solid transparent;border-radius:4px;color:var(--text-main);font-size:16px;outline:none;}
        input:focus,select:focus{border-color:var(--primary);}
        button{width:100%;padding:14px;background-color:var(--primary);color:white;border:none;border-radius:4px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;}
        button:hover{background-color:var(--primary-hover);}
        #dashboard-view{display:none;}
        .profile-header{display:flex;align-items:center;gap:15px;margin-bottom:25px;padding-bottom:20px;border-bottom:1px solid #3f4147;}
        .avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);}
        .user-info h3{font-size:18px;}
        .user-info p{color:var(--text-muted);font-size:14px;}
        .btn-logout{background-color:transparent;color:var(--danger);width:auto;padding:5px 10px;font-size:12px;margin-left:auto;border:1px solid var(--danger);}
        .btn-logout:hover{background-color:var(--danger);color:white;}
        .btn-toggle{background-color:var(--success);font-size:18px;padding:16px;}
        .btn-toggle.running{background-color:var(--danger);}
        .token-helper{display:block;text-align:right;margin-top:8px;font-size:13px;color:#00b0f4;text-decoration:none;}
        .token-helper:hover{text-decoration:underline;}
        #error-msg{color:var(--danger);text-align:center;margin-top:10px;font-size:14px;display:none;}
    </style>
</head>
<body>

<div class="container">
    <div id="login-view" class="card">
        <h2>Mudae Auto-Roll</h2>
        <div class="form-group">
            <label>Discord Token</label>
            <input type="password" id="token-input" placeholder="Enter token ( Encryption is recommended )">
        </div>
        <button id="btn-login" onclick="login()">Log In</button>
        <a href="https://youtu.be/LnBnm_tZlyU" target="_blank" class="token-helper">How to get token ?</a>
        <p id="error-msg">Invalid token!</p>
    </div>

    <div id="dashboard-view" class="card">
        <div class="profile-header">
            <img id="user-avatar" class="avatar" src="" alt="Avatar">
            <div class="user-info">
                <h3 id="user-name">Loading...</h3>
                <p>Status: Connected</p>
            </div>
            <button class="btn-logout" onclick="logout()">Log out</button>
        </div>
        <div class="form-group">
            <label>Command Type</label>
            <select id="cmd-type" onchange="updateConfig()">
                <option value="prefix">Prefix ($)</option>
                <option value="slash">Slash (/)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Roll Type</label>
            <select id="roll-type" onchange="updateConfig()">
                <option value="wa">Wa</option>
                <option value="wg">Wg</option>
                <option value="ha">Ha</option>
                <option value="hg">Hg</option>
            </select>
        </div>
        <div class="form-group">
            <label>Channel ID</label>
            <input type="text" id="channel-id" placeholder="Enter Channel ID..." oninput="updateConfig()">
        </div>
        <button id="btn-toggle" class="btn-toggle" onclick="toggleBot()">▶ START</button>
    </div>
</div>

<script>
    const API_URL = "https://washout-marital-parsnip.ngrok-free.dev";
    let isRunning = false;
    let currentUserToken = "";
    let currentUserName = "";

    async function login() {
        const tokenInput = document.getElementById('token-input').value.trim();
        const btnLogin = document.getElementById('btn-login');
        const errorMsg = document.getElementById('error-msg');
        if (!tokenInput) return;
        btnLogin.disabled = true;
        btnLogin.innerText = "Checking...";
        errorMsg.style.display = "none";
        try {
            const response = await fetch("https://discord.com/api/v10/users/@me", {
                headers: { "Authorization": tokenInput }
            });
            if (response.ok) {
                const userData = await response.json();
                currentUserName = userData.global_name || userData.username;
                const avatarUrl = userData.avatar 
                    ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png?size=128`
                    : `https://cdn.discordapp.com/embed/avatars/${userData.discriminator % 5}.png`;
                document.getElementById('user-avatar').src = avatarUrl;
                document.getElementById('user-name').innerText = currentUserName;
                currentUserToken = tokenInput;

                const statusRes = await fetch(`${API_URL}/api/status`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: currentUserToken })
                });
                const statusData = await statusRes.json();

                document.getElementById('login-view').style.display = "none";
                document.getElementById('dashboard-view').style.display = "block";

                const btnToggle = document.getElementById('btn-toggle');

                if (statusData.running) {
                    isRunning = true;
                    btnToggle.classList.add('running');
                    btnToggle.innerText = "■ STOP";
                } else {
                    isRunning = false;
                    btnToggle.classList.remove('running');
                    btnToggle.innerText = "▶ START";
                }
            } else {
                errorMsg.style.display = "block";
            }
        } catch (e) {
            errorMsg.style.display = "block";
        }
        btnLogin.disabled = false;
        btnLogin.innerText = "Log In";
    }

    async function updateConfig() {
        if (!isRunning) return;
        const config = {
            token: currentUserToken,
            cmdType: document.getElementById('cmd-type').value,
            rollType: document.getElementById('roll-type').value,
            channelId: document.getElementById('channel-id').value
        };
        try {
            await fetch(`${API_URL}/api/update`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(config)
            });
        } catch (e) {}
    }

    function logout() {
        if (isRunning) toggleBot(); 
        currentUserToken = "";
        document.getElementById('token-input').value = "";
        document.getElementById('dashboard-view').style.display = "none";
        document.getElementById('login-view').style.display = "block";
    }

    async function toggleBot() {
        const btnToggle = document.getElementById('btn-toggle');
        const config = {
            token: currentUserToken,
            username: currentUserName,
            avatarUrl: document.getElementById('user-avatar').src,
            cmdType: document.getElementById('cmd-type').value,
            rollType: document.getElementById('roll-type').value,
            channelId: document.getElementById('channel-id').value
        };
        try {
            if (isRunning) {
                btnToggle.innerText = "Stopping...";
                const response = await fetch(`${API_URL}/api/stop`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: config.token })
                });
                if (response.ok) {
                    isRunning = false;
                    btnToggle.classList.remove('running');
                    btnToggle.innerText = "▶ START";
                }
            } else {
                if (!config.channelId) {
                    alert("Please enter a Channel ID!");
                    return;
                }
                btnToggle.innerText = "Starting...";
                const response = await fetch(`${API_URL}/api/start`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(config)
                });
                if (response.ok) {
                    isRunning = true;
                    btnToggle.classList.add('running');
                    btnToggle.innerText = "■ STOP";
                }
            }
        } catch (e) {
            alert("Connection error to VPS!");
            btnToggle.innerText = isRunning ? "■ STOP" : "▶ START";
        }
    }
</script>
</body>
</html>
