<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudae Admin Panel</title>
    <style>
        :root{--bg-color:#23272a;--card-bg:#2c2f33;--primary:#5865F2;--primary-hover:#4752C4;--success:#3ba55d;--danger:#ed4245;--text-main:#ffffff;--text-muted:#b9bbbe;--input-bg:#202225;}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
        body{background-color:var(--bg-color);color:var(--text-main);display:flex;justify-content:center;align-items:center;min-height:100vh;}
        .container{width:100%;max-width:600px;padding:20px;}
        .card{background-color:var(--card-bg);border-radius:12px;padding:30px;box-shadow:0 8px 24px rgba(0,0,0,0.2);margin-bottom:15px;}
        h2{text-align:center;margin-bottom:20px;color:var(--text-main);}
        .form-group{margin-bottom:15px;}
        label{display:block;margin-bottom:8px;color:var(--text-muted);font-size:14px;font-weight:600;}
        input[type="password"]{width:100%;padding:12px;background-color:var(--input-bg);border:1px solid transparent;border-radius:4px;color:var(--text-main);font-size:16px;outline:none;}
        input:focus{border-color:var(--primary);}
        button{width:100%;padding:14px;background-color:var(--primary);color:white;border:none;border-radius:4px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;}
        button:hover{background-color:var(--primary-hover);}
        #admin-dashboard{display:none;}
        .bot-item{background:var(--input-bg);padding:15px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;gap:15px;}
        .bot-avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);}
        .bot-info{flex-grow:1;}
        .bot-info strong{font-size:16px;color:#fff;}
        .bot-info p{color:var(--text-muted);font-size:13px;margin-top:3px;}
        .btn-kill{background-color:var(--danger);width:auto;padding:8px 14px;font-size:13px;margin:0;}
    </style>
</head>
<body>

<div class="container">
    <div id="admin-login-card" class="card">
        <h2>Admin Login</h2>
        <div class="form-group">
            <label>Admin Password</label>
            <input type="password" id="admin-pass" placeholder="Enter admin password...">
        </div>
        <button onclick="loginAdmin()">Access</button>
        <p id="login-error" style="color:var(--danger); text-align:center; margin-top:10px; display:none;">Incorrect password!</p>
    </div>

    <div id="admin-dashboard" class="card">
        <h2>Active Sessions Management</h2>
        <div id="bot-list-container">Loading...</div>
        <button style="background-color: #4f545c;" onclick="loadAdminBots()">Refresh List</button>
    </div>
</div>

<script>
    const API_URL = "https://washout-marital-parsnip.ngrok-free.dev";
    let adminPassword = "";

    async function loginAdmin() {
        adminPassword = document.getElementById('admin-pass').value;
        const errorMsg = document.getElementById('login-error');
        errorMsg.style.display = "none";

        try {
            const res = await fetch(`${API_URL}/api/admin/list`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: adminPassword })
            });

            if (res.ok) {
                document.getElementById('admin-login-card').style.display = "none";
                document.getElementById('admin-dashboard').style.display = "block";
                renderBots(await res.json());
            } else {
                errorMsg.style.display = "block";
            }
        } catch (e) {
            alert("Cannot connect to VPS!");
        }
    }

    async function loadAdminBots() {
        try {
            const res = await fetch(`${API_URL}/api/admin/list`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: adminPassword })
            });
            if (res.ok) {
                renderBots(await res.json());
            }
        } catch (e) {}
    }

    function renderBots(data) {
        const container = document.getElementById('bot-list-container');
        if (data.bots.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#b9bbbe;'>No active accounts found.</p>";
            return;
        }
        let html = "";
        data.bots.forEach(b => {
            html += `<div class="bot-item">
                <img class="bot-avatar" src="${b.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png'}" alt="Avatar">
                <div class="bot-info">
                    <strong>${b.username}</strong>
                    <p>Token: <code>${b.masked_token}</code></p>
                    <p>Settings: Command <b>${b.cmd_type.toUpperCase()}</b> | Roll <b>${b.roll_type.toUpperCase()}</b> | Channel: <code>${b.channel_id}</code></p>
                </div>
                <button class="btn-kill" onclick="killBot('${b.token}')">Disconnect</button>
            </div>`;
        });
        container.innerHTML = html;
    }

    async function killBot(tokenToKill) {
        if (!confirm("Are you sure you want to disconnect this account?")) return;
        try {
            const res = await fetch(`${API_URL}/api/admin/kill`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: adminPassword, token: tokenToKill })
            });
            if (res.ok) {
                loadAdminBots();
            } else {
                alert("Failed!");
            }
        } catch (e) {
            alert("Connection error to VPS");
        }
    }
</script>
</body>
</html>
